name: Java 21 CI Build & Test Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  build:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build and Run All Unit Tests
        run: ./gradlew test testAudit --continue

      - name: Generate JaCoCo Code Coverage Report
        if: always()
        run: ./gradlew jacocoTestReport --continue

      - name: Publish Test Summary & JaCoCo Coverage to GitHub Step Summary
        if: always()
        run: |
          python3 -c '
          import os, glob, xml.etree.ElementTree as ET

          summary = []
          summary.append("### 📊 Test Suite & Code Coverage Audit Report\n")

          xml_files = glob.glob("**/build/test-results/test/TEST-*.xml", recursive=True)
          total_tests = 0
          passed_tests = 0
          failed_tests = 0

          module_stats = {}

          for xml_path in xml_files:
              subproject = xml_path.split("/")[0]
              if subproject not in module_stats:
                  module_stats[subproject] = {"tests": 0, "passed": 0, "failed": 0}
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  for case in root.findall("testcase"):
                      total_tests += 1
                      module_stats[subproject]["tests"] += 1
                      failure = case.find("failure")
                      error = case.find("error")
                      if failure is not None or error is not None:
                          failed_tests += 1
                          module_stats[subproject]["failed"] += 1
                      else:
                          passed_tests += 1
                          module_stats[subproject]["passed"] += 1
              except Exception:
                  pass

          if total_tests > 0:
              summary.append(f"**Total Test Cases Executed**: `{total_tests}` | **Passed**: `{passed_tests}` | **Failed**: `{failed_tests}`\n")
              if total_tests >= 40:
                  summary.append(f"**✓ Target Met**: `{total_tests}` / `40+` required unit tests PASSED ({total_tests/40*100:.1f}% of target)\n")
              else:
                  summary.append(f"**! Target Pending**: `{total_tests}` / `40+` required unit tests ({40 - total_tests} more needed)\n")

          summary.append("#### 📈 Module Coverage & Test Breakdown\n")
          summary.append("| Subproject Module | Tests Executed | Passed | Failed | Line Coverage |")
          summary.append("|:---|:---:|:---:|:---:|:---:|")

          coverage_files = glob.glob("**/build/reports/jacoco/test/jacocoTestReport.xml", recursive=True)
          coverage_map = {}
          for cov in coverage_files:
              subproject = cov.split("/")[0]
              try:
                  tree = ET.parse(cov)
                  root = tree.getroot()
                  lines = [c for c in root.findall("counter") if c.get("type") == "LINE"]
                  if lines:
                      l = lines[0]
                      missed = int(l.get("missed"))
                      covered = int(l.get("covered"))
                      total = covered + missed
                      pct = (covered / total * 100) if total > 0 else 0
                      coverage_map[subproject] = f"{pct:.1f}% ({covered}/{total} lines)"
              except Exception:
                  pass

          all_modules = sorted(list(set(list(module_stats.keys()) + list(coverage_map.keys()))))
          for mod in all_modules:
              m_tests = module_stats.get(mod, {}).get("tests", 0)
              m_passed = module_stats.get(mod, {}).get("passed", 0)
              m_failed = module_stats.get(mod, {}).get("failed", 0)
              m_cov = coverage_map.get(mod, "N/A")
              summary.append(f"| `{mod}` | {m_tests} | {m_passed} | {m_failed} | {m_cov} |")

          markdown_content = "\n".join(summary) + "\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(markdown_content)

          with open("pr_coverage_comment.md", "w") as f:
              f.write(markdown_content)
          '

      - name: Post Coverage Comment to Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: pr_coverage_comment.md

      - name: Upload JaCoCo Coverage HTML Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: '**/build/reports/jacoco/'
          if-no-files-found: ignore
